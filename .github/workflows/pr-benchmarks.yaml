name: PR benchmarks

# Per-PR BenchmarkDotNet perf-regression detection (#178).
#
# Complements benchmarks.yaml (which runs on push to main and publishes
# the trend to gh-pages). This workflow runs BDN on the PR HEAD in short
# mode, then compares the results against the gh-pages baseline from the
# last main-branch run via benchmark-action/github-action-benchmark.
#
# Fails the PR if any metric regressed by more than 150% vs baseline.
# The threshold is deliberately loose — GitHub-hosted runners are noisy;
# tighten once the noise floor settles.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - '.github/workflows/pr-benchmarks.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # for benchmark-action to comment the delta table

concurrency:
  group: pr-benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-benchmarks:
    name: BDN delta vs main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore + build (Release)
        run: |
          dotnet restore benchmarks/Wolfgang.Extensions.IComparable.Benchmarks/Wolfgang.Extensions.IComparable.Benchmarks.csproj
          dotnet build -c Release --no-restore benchmarks/Wolfgang.Extensions.IComparable.Benchmarks/Wolfgang.Extensions.IComparable.Benchmarks.csproj

      - name: Run benchmarks (short mode)
        working-directory: benchmarks/Wolfgang.Extensions.IComparable.Benchmarks
        run: dotnet run -c Release --no-build -- --filter "*" --job short --memory --exporters json

      - name: Merge per-class BDN reports
        id: locate
        working-directory: benchmarks/Wolfgang.Extensions.IComparable.Benchmarks
        run: |
          shopt -s nullglob
          reports=(BenchmarkDotNet.Artifacts/results/*-report-full-compressed.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No BenchmarkDotNet JSON report found"
            exit 1
          fi
          jq -s '{
            Title: "BenchmarkDotNet PR report",
            HostEnvironmentInfo: .[0].HostEnvironmentInfo,
            Benchmarks: [.[].Benchmarks[]]
          }' "${reports[@]}" > benchmarks-result.json
          echo "report=benchmarks/Wolfgang.Extensions.IComparable.Benchmarks/benchmarks-result.json" >> "$GITHUB_OUTPUT"

      - name: Compare vs gh-pages baseline
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        with:
          name: BenchmarkDotNet
          tool: 'benchmarkdotnet'
          output-file-path: ${{ steps.locate.outputs.report }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          # Do NOT push the PR run to gh-pages — that data goes there only
          # on merge to main via benchmarks.yaml. PR runs are ephemeral.
          auto-push: false
          save-data-file: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Threshold and gate behaviour.
          #
          # The extension methods measure at sub-nanosecond scale on the JIT-
          # inlined hot path (0.3 ns/op range). GitHub-hosted runners cannot
          # measure at that scale reliably: gh-pages baselines routinely record
          # near-zero (or literal 0) ns values, and any real measurement then
          # "regresses" against that noise floor with absurd ratios (100x+,
          # ∞). Until the noise floor settles — either bigger benchmark
          # workloads or a dedicated runner — the PR gate stays advisory. The
          # delta table still lands as a PR comment (which is what #178
          # actually asked for); the workflow just doesn't fail the PR on it.
          # Matches the existing benchmarks.yaml pattern on main-merges.
          alert-threshold: '200%'
          fail-on-alert: false
          # Post a comment on the PR summarising the delta table.
          comment-on-alert: true
          summary-always: true
